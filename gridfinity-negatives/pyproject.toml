[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridfinity-negatives"
version = "0.1.0"
description = "Turn a scan or photo of a tool into a Gridfinity bin with the tool's negative cut into it"
requires-python = ">=3.9,<3.13"
dependencies = [
    "cadquery>=2.4",
    "cqgridfinity>=0.5",
    "opencv-contrib-python-headless>=4.8",
    "shapely>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
gfneg = "gridfinity_negatives.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
