# KWL1N1T — kitchen, west wall, lower section, 1st north column, 1st from top
# Drawer 542.5 x 328.5 x 63 mm internal (gauged 2026-09-25: left gap 38.5 mm,
# front gap 34.5 mm). 12 x 7 units, grid in the BACK-RIGHT corner.
# Columns A-L from the left, rows 1-7 with row 1 at the FRONT.
#
# BIN HEIGHT IS 5U AND LOCKED. 38.8 mm tall, 28 mm usable depth.
# Items thicker than 28 mm stand proud of the rim, which the 63 mm drawer
# has room for.
#
# Row 1 reaches 34.5 mm forward to the drawer front. The BBQ bin reaches
# 38.5 mm left to the wall. The left gap stands in rows 1-5.

defaults:
  bin_height_u: 5

items:
  # --- row 1, the front: 1 unit deep + 34.5 mm to the drawer front ---
  - {name: Spare, size: [0, 0], bin_size: 3x1, at: A1, extend_front_mm: 34.5}
  - {name: Spare, size: [0, 0], bin_size: 2x1, at: D1, extend_front_mm: 34.5}

  - name: GPS
    size: [167, 75, 40]
    bin_size: 4x1
    at: F1
    extend_front_mm: 34.5
    qty_max: 1
    note: >
      Moved here from A4:E5, swapping names with the spare that was in this
      position. NOTE: a front-row bin is 76.0 mm deep whatever its length,
      and the GPS is 75 mm wide — it does not fit. See drawers.md.

  - {name: Spare, size: [0, 0], bin_size: 3x1, at: J1, extend_front_mm: 34.5}

  # --- rows 2-3 ---
  - name: Flashlight
    size: [195, 39, 39]
    bin_size: 5x2
    at: A2
    qty_max: 4
    note: Moved out of rows 6-7 to make room for the Bic and accessories bins.

  - name: Accessories
    size: [84, 75, 40]
    bin_size: 3x2
    at: F2
    measured: false

  - {name: Spare, size: [0, 0], bin_size: 2x2, at: I2}
  - {name: Spare, size: [0, 0], bin_size: 2x2, at: K2}

  # --- rows 4-5 ---
  - {name: Spare, size: [0, 0], bin_size: 5x2, at: A4}   # was the GPS bin
  - {name: Spare, size: [0, 0], bin_size: 2x2, at: F4}
  - {name: Spare, size: [0, 0], bin_size: 1x2, at: H4}

  - name: Accessories
    size: [84, 75, 40]
    bin_size: 4x2
    at: I4
    measured: false
    note: Moved to the right edge as directed.

  # --- rows 6-7, the back ---
  - name: BBQ lighter
    size: [272, 43, 24]
    bin_size: 6x2
    at: A6
    extend_left_mm: 38.5
    qty_typical: 3
    qty_max: 4
    note: Six squares plus the 38.5 mm left gap — 290.5 mm long, meets the wall.

  - name: Accessories
    size: [84, 75, 40]
    bin_size: 3x2
    at: G6
    measured: false
    note: Moved to G6:I7 as directed.

  - name: Bic lighter
    size: [81, 24, 12]
    bin_size: 3x2
    at: J6
    qty_typical: 2
    qty_max: 10
    measured: false
    note: Moved to J6:L7 as directed. Commodity Bic size, NOT measured.
