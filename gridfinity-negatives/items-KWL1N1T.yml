# KWL1N1T — kitchen, west wall, lower section, 1st north column, 1st from top
# Drawer 533 x 328 x 63 mm internal, 12 x 7 units. Columns A-L, rows 1-7 with
# row 1 at the FRONT.
#
# at: places a bin exactly. Layout as directed 2026-09-25 MDT.

# Every bin in this drawer is ONE height. The value is provisional until the
# first print is in the drawer -- change bin_height_u here and it reaches
# every bin, including the auto-filled spares.
defaults:
  bin_height_u: 8
  bin_height_provisional: true

items:
  - name: BBQ lighter
    size: [272, 43, 24]
    bin_size: 7x2
    at: A6
    qty_typical: 3
    qty_max: 4
    note: >
      Back left. A 7x2 at 8U is 288.7 x 78.7 x 49 mm inside: one lighter
      across the width, two stacked in the depth. CAPACITY IS 2, not 4.

  - name: GPS
    size: [167, 75, 40]
    bin_size: 5x2
    at: A4
    qty_typical: 1
    qty_max: 1
    note: Swapped with the flashlights 2026-09-25 MDT.

  - name: Flashlight
    size: [195, 39, 39]
    bin_size: 5x2
    at: H6
    qty_typical: 4
    qty_max: 4
    note: Back right, alongside the BBQ lighters. Swapped with the GPS 2026-09-25 MDT.

  - name: Accessories
    size: [84, 75, 40]
    bin_size: 2x2
    at: H4
    measured: false
    note: >
      Replaced the right-hand flashlight bin, 2026-09-25 MDT. Width and
      height assumed to match the large GPS and NOT measured.

  - name: Accessories
    size: [84, 75, 40]
    bin_size: 3x2
    at: J4
    measured: false
    note: Second half of the former right flashlight bin.

  - name: Bic lighter
    size: [81, 24, 12]
    bin_size: 2x3
    at: H1
    qty_typical: 2
    qty_max: 10
    measured: false
    note: In front of the GPS. Commodity Bic size, NOT measured from yours.

  - name: Accessories
    size: [84, 75, 40]
    bin_size: 3x2
    at: A1
    measured: false
    note: >
      Formerly "GPS small". Width and height assumed to match the large GPS
      and NOT measured.
