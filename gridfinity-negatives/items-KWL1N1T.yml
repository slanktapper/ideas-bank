# KWL1N1T — kitchen, west wall, lower section, 1st north column, 1st from top
# Drawer 533 x 328.5 x 63 mm internal. Gaps: left 29.0 mm, front 34.5 mm.
# The left gap was first taken as 38.5 and corrected to 29.0 on 2026-09-26
# after bin 1 was printed: its front fitted, its left did not. 12 x 7 units, grid in the BACK-RIGHT corner.
# Columns A-L from the left, rows 1-7 with row 1 at the FRONT.
#
# BIN HEIGHT IS 5U AND LOCKED. 38.8 mm tall, 28 mm usable depth.
# Items thicker than 28 mm stand proud of the rim, which the 63 mm drawer
# has room for.
#
# Row 1 reaches 34.5 mm forward to the drawer front.
# The leftmost bin in every band reaches 29.0 mm left to the wall.
# Bin 1 is the corner bin: it reaches both ways, closing the front-left.

defaults:
  bin_height_u: 5
  # NO PRINTED LABEL SHELF, EVER, IN THE KITCHEN. Clip-on labels only, added
  # later if wanted. A moulded shelf overhangs the opening, cannot be removed,
  # and costs ~9.4 cm3 a bin. gfneg refuses to add one while this is false.
  label_shelf: false

items:
  # --- row 1, the front: 1 unit deep + 34.5 mm to the drawer front ---
  - {name: Spare, size: [0, 0], bin_size: 3x1, at: A1, extend_front_mm: 34.5, extend_left_mm: 29.0}   # corner bin: reaches both ways
  - {name: Spare, size: [0, 0], bin_size: 2x1, at: D1, extend_front_mm: 34.5}

  - name: GPS
    size: [167, 75, 40]
    bin_size: 4x1
    at: F1
    extend_front_mm: 34.5
    qty_max: 1
    note: >
      Moved here from A4:E5, swapping names with the spare that was in this
      position. NOTE: a front-row bin is 76.0 mm deep whatever its length,
      and the GPS is 75 mm wide — it does not fit. See drawers.md.

  - {name: Spare, size: [0, 0], bin_size: 3x1, at: J1, extend_front_mm: 34.5}

  # --- rows 2-3 ---
  - {name: Spare, size: [0, 0], bin_size: 2x2, at: A2, extend_left_mm: 29.0}

  - name: Accessories
    size: [84, 75, 40]
    bin_size: 3x2
    at: C2
    measured: false

  - name: Flashlight
    size: [195, 39, 39]
    bin_size: 5x2
    at: F2
    qty_max: 4
    note: Swapped right past the accessories and spare bins.

  - {name: Spare, size: [0, 0], bin_size: 2x2, at: K2}

  # --- rows 4-5 ---
  - {name: Spare, size: [0, 0], bin_size: 1x2, at: A4, extend_left_mm: 29.0}
  - {name: Spare, size: [0, 0], bin_size: 2x2, at: B4}
  - {name: Spare, size: [0, 0], bin_size: 5x2, at: D4}   # was the GPS bin

  - name: Accessories
    size: [84, 75, 40]
    bin_size: 4x2
    at: I4
    measured: false
    note: Moved to the right edge as directed.

  # --- rows 6-7, the back ---
  - name: BBQ lighter
    size: [272, 43, 24]
    bin_size: 6x2
    at: A6
    extend_left_mm: 29.0
    qty_typical: 3
    qty_max: 4
    note: Six squares plus the 29.0 mm left gap — 281.0 mm long, meets the wall.

  - name: Accessories
    size: [84, 75, 40]
    bin_size: 3x2
    at: G6
    measured: false
    note: Moved to G6:I7 as directed.

  - name: Bic lighter
    size: [81, 24, 12]
    bin_size: 3x2
    at: J6
    qty_typical: 2
    qty_max: 10
    measured: false
    printed: true   # printed 2026-09-26 MDT -- first bin of this drawer in place
    note: Moved to J6:L7 as directed. Commodity Bic size, NOT measured.
